<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Get U Fit Gym</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000;
            --panel-card: #13131a;
            --panel-border: rgba(255,255,255,0.1);
            --red: #D4145A;
            --red-hover: #b30f4a;
            --white: #ffffff;
        }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #060608 radial-gradient(ellipse at 50% 20%, rgba(212,20,90,0.15), transparent 70%);
            color: var(--white);
            min-height: 100vh;
        }
        .error-card {
            background: var(--panel-card);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .btn-red {
            background-color: var(--red);
            border-color: var(--red);
            color: #fff;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px 24px;
            transition: all 0.2s ease;
        }
        .btn-red:hover {
            background-color: var(--red-hover);
            border-color: var(--red-hover);
            color: #fff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5 text-center">

            <div class="card error-card p-4 p-sm-5 text-white">
                <div class="mb-3">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center"
                         style="width: 80px; height: 80px; background: rgba(212,20,90,0.15); border: 2px solid #D4145A;">
                        <i class="bi bi-shield-lock-fill text-danger" style="font-size: 2.4rem;"></i>
                    </div>
                </div>

                <h3 class="fw-bold mt-2">Access Restricted</h3>
                <p class="text-secondary small mt-2">
                    Your current account does not have permission to view or modify this administrative resource.
                </p>

                <div class="my-3 p-3 rounded bg-dark border border-secondary border-opacity-25 text-start small">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-secondary">Security Protocol:</span>
                        <span class="text-danger fw-semibold">HTTP 403 Forbidden</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-secondary">Authorized Roles:</span>
                        <span class="text-white">Admin / Authorized Staff</span>
                    </div>
                </div>

                <div class="d-flex flex-column gap-2 mt-3">
                    <a th:href="@{${portalLink}}" class="btn btn-red d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-arrow-left-circle"></i> Return to <span th:text="${portalName}">My Portal</span>
                    </a>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm py-2 text-white border-secondary">
                        <i class="bi bi-house me-1"></i> Public Home Page
                    </a>
                </div>
            </div>

            <p class="text-secondary small mt-4" style="font-size:0.78rem;">
                Get U Fit Gym Security &bull; Colombo, Sri Lanka
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
