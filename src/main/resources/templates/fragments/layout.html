<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Get U Fit Gym'">Get U Fit Gym</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="sidebar bg-dark text-white p-3 d-flex flex-column" style="min-width: 260px; min-height: 100vh;">
        <div class="brand d-flex align-items-center mb-4 pb-3 border-bottom border-secondary">
            <div class="brand-icon me-2 bg-primary text-white rounded p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="bi bi-lightning-charge-fill fs-5"></i>
            </div>
            <div>
                <h5 class="m-0 fw-bold text-white tracking-wide">APEX<span class="text-primary">FIT</span></h5>
                <small class="text-secondary" style="font-size: 0.75rem;">GYM MANAGEMENT</small>
            </div>
        </div>

        <ul class="nav nav-pills flex-column mb-auto gap-1">
            <li class="nav-item">
                <a th:href="@{/dashboard}" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/members}" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-people-fill"></i> Members
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/trainers}" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-person-badge-fill"></i> Trainers
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/plans}" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-card-checklist"></i> Membership Plans
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/subscriptions}" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-receipt"></i> Subscriptions
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/attendance}" class="nav-link text-white d-flex align-items-center gap-2">
                    <i class="bi bi-clock-history"></i> Attendance
                </a>
            </li>
        </ul>

        <hr class="border-secondary my-3">

        <div class="tools-section">
            <small class="text-uppercase text-secondary fw-bold px-2" style="font-size: 0.7rem;">Developer Tools</small>
            <div class="mt-2 d-flex flex-column gap-1">
                <a th:href="@{/h2-console}" target="_blank" class="nav-link text-secondary d-flex align-items-center gap-2 px-2 py-1 small hover-light">
                    <i class="bi bi-database"></i> H2 DB Console <i class="bi bi-box-arrow-up-right ms-auto small"></i>
                </a>
                <a th:href="@{/api/stats}" target="_blank" class="nav-link text-secondary d-flex align-items-center gap-2 px-2 py-1 small hover-light">
                    <i class="bi bi-code-slash"></i> REST API Stats <i class="bi bi-box-arrow-up-right ms-auto small"></i>
                </a>
            </div>
        </div>

        <div class="user-card mt-3 pt-3 border-top border-secondary d-flex align-items-center gap-2">
            <div class="bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <div class="flex-grow-1 overflow-hidden">
                <div class="fw-semibold text-truncate small">Admin Manager</div>
                <div class="text-success small" style="font-size: 0.75rem;"><i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Online</div>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-2 sticky-top">
            <div class="container-fluid p-0">
                <span class="navbar-brand text-muted fs-6 mb-0">
                    <i class="bi bi-calendar3 me-1"></i> <span id="currentDate">Today</span>
                </span>
                <div class="ms-auto d-flex align-items-center gap-3">
                    <a th:href="@{/attendance}" class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1">
                        <i class="bi bi-qr-code-scan"></i> Check-In Desk
                    </a>
                    <a th:href="@{/members/new}" class="btn btn-sm btn-primary d-flex align-items-center gap-1">
                        <i class="bi bi-person-plus-fill"></i> Add Member
                    </a>
                </div>
            </div>
        </nav>

        <!-- Flash messages -->
        <div class="px-4 pt-3">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill fs-5"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <!-- Page Dynamic Body -->
        <div class="p-4 flex-grow-1">
            <div th:replace="${content}"></div>
        </div>

        <footer class="bg-white border-top py-3 px-4 text-muted small text-center">
            Get U Fit Gym Colombo &bull; Gym Management System &bull; Powered by Spring Boot 3 &amp; Thymeleaf
        </footer>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
    });
</script>
</body>
</html>
