<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head('Trainers')}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('trainers')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold m-0">Gym Trainers &amp; Coaches</h3>
                    <p class="text-muted small m-0">Fitness coaches, specialized instructors, and assigned athletes</p>
                </div>
                <div>
                    <a th:href="@{/trainers/new}" class="btn btn-primary d-flex align-items-center gap-1">
                        <i class="bi bi-person-plus-fill"></i> Add New Trainer
                    </a>
                </div>
            </div>

            <!-- Trainers Grid -->
            <div class="row g-4">
                <div class="col-12" th:if="${#lists.isEmpty(trainers)}">
                    <div class="card p-5 text-center text-muted">
                        <i class="bi bi-person-x fs-1 mb-2"></i>
                        No trainers registered in the system yet.
                    </div>
                </div>

                <div class="col-xl-3 col-md-6" th:each="t : ${trainers}">
                    <div class="card shadow-sm h-100">
                        <div class="card-body p-4 text-center">
                            <div class="bg-dark bg-opacity-10 text-dark rounded-circle fw-bold d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px; font-size: 1.5rem;">
                                <i class="bi bi-person-badge text-primary"></i>
                            </div>
                            <h5 class="fw-bold mb-1" th:text="${t.fullName}">Trainer Name</h5>
                            <span class="badge bg-primary bg-opacity-10 text-primary mb-3" th:text="${t.specialization}">CrossFit</span>

                            <div class="bg-light p-3 rounded text-start small mb-3">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-muted">Experience:</span>
                                    <span class="fw-semibold" th:text="${t.experienceYears} + ' years'">0</span>
                                </div>
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-muted">Salary:</span>
                                    <span class="fw-semibold text-success" th:text="'$' + ${#numbers.formatDecimal(t.salary, 1, 0)} + '/yr'">$0</span>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted">Assigned Members:</span>
                                    <span class="fw-semibold text-primary" th:text="${#lists.size(t.members)} + ' members'">0</span>
                                </div>
                            </div>

                            <div class="text-muted small text-start mb-3">
                                <div class="text-truncate"><i class="bi bi-envelope me-1"></i> <span th:text="${t.email}">email</span></div>
                                <div class="text-truncate"><i class="bi bi-telephone me-1"></i> <span th:text="${t.phone}">phone</span></div>
                            </div>

                            <div class="d-flex justify-content-center gap-2 pt-2 border-top">
                                <a th:href="@{'/trainers/edit/' + ${t.id}}" class="btn btn-sm btn-outline-primary w-50">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <a th:href="@{'/trainers/delete/' + ${t.id}}" class="btn btn-sm btn-outline-danger w-50" onclick="return confirm('Delete this trainer?');">
                                    <i class="bi bi-trash"></i> Delete
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

</body>
</html>
