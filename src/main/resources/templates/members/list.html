<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head('Members')}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('members')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold m-0">Gym Members</h3>
                    <p class="text-muted small m-0">Directory of registered athletes and gym members</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/members/new}" class="btn btn-primary d-flex align-items-center gap-1">
                        <i class="bi bi-person-plus-fill"></i> Register New Member
                    </a>
                </div>
            </div>

            <!-- Search and Filter Bar -->
            <div class="card p-3 mb-4 bg-white shadow-sm">
                <form th:action="@{/members}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-9 col-sm-8">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" name="q" th:value="${query}" class="form-control" placeholder="Search member by first name, last name, email, or phone number...">
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-4 d-flex gap-2">
                        <button type="submit" class="btn btn-outline-primary w-100">Search</button>
                        <a th:href="@{/members}" class="btn btn-light" th:if="${query != null and !query.isEmpty()}">Clear</a>
                    </div>
                </form>
            </div>

            <!-- Members Table Card -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Member Name</th>
                                    <th>Contact Info</th>
                                    <th>Status</th>
                                    <th>Assigned Trainer</th>
                                    <th>Joined Date</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(members)}">
                                    <td colspan="6" class="text-center text-muted py-5">
                                        <i class="bi bi-person-x fs-1 d-block mb-2"></i>
                                        No gym members found matching criteria.
                                    </td>
                                </tr>
                                <tr th:each="m : ${members}">
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="bg-primary bg-opacity-10 text-primary rounded-circle fw-bold d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                                                <span th:text="${#strings.substring(m.firstName,0,1)} + ${#strings.substring(m.lastName,0,1)}">JD</span>
                                            </div>
                                            <div>
                                                <a th:href="@{'/members/view/' + ${m.id}}" class="fw-semibold text-dark text-decoration-none" th:text="${m.fullName}">Name</a>
                                                <div class="text-muted small" th:text="${m.gender != null ? m.gender : 'Unspecified'}">Gender</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="small fw-semibold" th:text="${m.email}">email</div>
                                        <div class="text-muted small" th:text="${m.phone}">phone</div>
                                    </td>
                                    <td>
                                        <span th:if="${m.status.name() == 'ACTIVE'}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">ACTIVE</span>
                                        <span th:if="${m.status.name() == 'INACTIVE'}" class="badge bg-secondary bg-opacity-10 text-secondary border">INACTIVE</span>
                                        <span th:if="${m.status.name() == 'EXPIRED'}" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25">EXPIRED</span>
                                        <span th:if="${m.status.name() == 'PENDING'}" class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25">PENDING</span>
                                    </td>
                                    <td>
                                        <span th:if="${m.assignedTrainer != null}" class="badge bg-light text-dark border">
                                            <i class="bi bi-person-badge text-primary me-1"></i> <span th:text="${m.assignedTrainer.fullName}">Trainer</span>
                                        </span>
                                        <span th:if="${m.assignedTrainer == null}" class="text-muted small">None assigned</span>
                                    </td>
                                    <td class="text-muted small" th:text="${m.joinDate}">2026-01-01</td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{'/members/view/' + ${m.id}}" class="btn btn-outline-secondary" title="View Profile">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{'/subscriptions/new?memberId=' + ${m.id}}" class="btn btn-outline-success" title="Assign Plan">
                                                <i class="bi bi-receipt"></i>
                                            </a>
                                            <a th:href="@{'/members/edit/' + ${m.id}}" class="btn btn-outline-primary" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{'/members/delete/' + ${m.id}}" class="btn btn-outline-danger" onclick="return confirm('Are you sure you want to delete this member? All associated subscriptions and attendance records will be removed.');" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

</body>
</html>
