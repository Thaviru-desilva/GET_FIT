<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head(${plan.id != null ? 'Edit Plan' : 'Create Plan'})}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('plans')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <div class="mb-4">
                <a th:href="@{/plans}" class="text-decoration-none text-muted small">&larr; Back to Plans</a>
                <h3 class="fw-bold mt-1" th:text="${plan.id != null ? 'Edit Membership Plan' : 'Create Membership Plan'}">Plan</h3>
            </div>

            <div class="card shadow-sm col-lg-7 mx-auto">
                <div class="card-header bg-white py-3">
                    <span class="fw-semibold text-primary"><i class="bi bi-card-checklist me-1"></i> Plan Information</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/plans/save}" th:object="${plan}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Plan Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. VIP Platinum, Monthly Starter" required>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Explain the perks included with this tier..."></textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Duration (in Days) *</label>
                                <input type="number" th:field="*{durationDays}" class="form-control" th:classappend="${#fields.hasErrors('durationDays')} ? 'is-invalid' : ''" min="1" placeholder="e.g. 30, 90, 365" required>
                                <div class="invalid-feedback" th:errors="*{durationDays}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Price ($ USD) *</label>
                                <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" min="0" placeholder="e.g. 49.99" required>
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeSwitch" checked>
                            <label class="form-check-label small fw-semibold" for="activeSwitch">Available for New Subscriptions</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/plans}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Save Plan
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

</body>
</html>
