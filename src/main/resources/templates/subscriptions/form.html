<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head('New Subscription')}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('subscriptions')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <div class="mb-4">
                <a th:href="@{/subscriptions}" class="text-decoration-none text-muted small">&larr; Back to Subscriptions</a>
                <h3 class="fw-bold mt-1">Activate Membership Subscription</h3>
            </div>

            <div class="card shadow-sm col-lg-7 mx-auto">
                <div class="card-header bg-white py-3">
                    <span class="fw-semibold text-primary"><i class="bi bi-receipt me-1"></i> Subscription Details</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/subscriptions/save}" method="post">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Member *</label>
                            <select name="memberId" class="form-select" required>
                                <option value="" disabled th:selected="${preselectedMemberId == null}">-- Select Member --</option>
                                <option th:each="m : ${members}"
                                        th:value="${m.id}"
                                        th:selected="${preselectedMemberId != null and preselectedMemberId == m.id}"
                                        th:text="${m.fullName} + ' (' + ${m.email} + ')'"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Membership Plan Tier *</label>
                            <select name="planId" id="planSelect" class="form-select" required onchange="updatePlanPrice()">
                                <option value="" disabled selected>-- Select Plan --</option>
                                <option th:each="p : ${plans}"
                                        th:value="${p.id}"
                                        th:data-price="${p.price}"
                                        th:text="${p.name} + ' - $' + ${#numbers.formatDecimal(p.price, 1, 2)} + ' (' + ${p.durationDays} + ' Days)'"></option>
                            </select>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Start Date *</label>
                                <input type="date" name="startDate" th:value="${today}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Amount Paid ($ USD)</label>
                                <input type="number" step="0.01" name="amountPaid" id="amountPaidInput" class="form-control" placeholder="Leave blank to use plan price">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Payment Status</label>
                            <select name="paymentStatus" class="form-select">
                                <option th:each="status : ${paymentStatuses}"
                                        th:value="${status}"
                                        th:text="${status}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/subscriptions}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Activate Subscription
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

<script>
    function updatePlanPrice() {
        const select = document.getElementById('planSelect');
        const selectedOption = select.options[select.selectedIndex];
        const price = selectedOption.getAttribute('data-price');
        if (price) {
            document.getElementById('amountPaidInput').value = price;
        }
    }
</script>

</body>
</html>
