<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head(${trainer.id != null ? 'Edit Trainer' : 'Add Trainer'})}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('trainers')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <div class="mb-4">
                <a th:href="@{/trainers}" class="text-decoration-none text-muted small">&larr; Back to Trainer Directory</a>
                <h3 class="fw-bold mt-1" th:text="${trainer.id != null ? 'Edit Trainer Profile' : 'Add New Trainer'}">Trainer</h3>
            </div>

            <div class="card shadow-sm col-lg-8 mx-auto">
                <div class="card-header bg-white py-3">
                    <span class="fw-semibold text-primary"><i class="bi bi-person-badge me-1"></i> Trainer Details</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/trainers/save}" th:object="${trainer}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">First Name *</label>
                                <input type="text" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" placeholder="e.g. Alex" required>
                                <div class="invalid-feedback" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Last Name *</label>
                                <input type="text" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" placeholder="e.g. Hunter" required>
                                <div class="invalid-feedback" th:errors="*{lastName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email Address *</label>
                                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="alex.hunter@apexfit.com" required>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Phone Number</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="+1-555-0101">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Specialization Area</label>
                                <input type="text" th:field="*{specialization}" class="form-control" placeholder="e.g. CrossFit, Powerlifting, Yoga">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Experience (Years)</label>
                                <input type="number" th:field="*{experienceYears}" class="form-control" min="0" placeholder="e.g. 5">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Annual Salary ($)</label>
                                <input type="number" step="0.01" th:field="*{salary}" class="form-control" min="0" placeholder="e.g. 50000">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/trainers}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Save Trainer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

</body>
</html>
