<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Get U Fit Gym Colombo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-black text-white d-flex align-items-center justify-content-center min-vh-100 py-5" style="background:#070709 !important;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">

            <!-- Brand header -->
            <div class="text-center mb-4">
                <a th:href="@{/}" class="text-decoration-none text-white d-inline-block">
                    <div class="d-inline-flex align-items-center gap-2 mb-2 p-2 px-3 border border-secondary rounded bg-dark" style="background:#111 !important;">
                        <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" style="width:28px;height:28px;" aria-hidden="true">
                            <path d="M4 12v8M8 9v14M28 12v8M24 9v14M8 16h16"/>
                        </svg>
                        <span class="text-start" style="line-height:1.1;">
                            <b style="font-size:13px;letter-spacing:1px;display:block;">GET U FIT</b>
                            <i style="font-style:normal;font-size:16px;font-weight:800;color:#D4145A;letter-spacing:3px;">GYM</i>
                        </span>
                    </div>
                </a>
                <p class="text-secondary text-uppercase tracking-wider small m-0" style="font-size:0.75rem;">Colombo's Premier Fitness Destination</p>
            </div>

            <!-- Login Card -->
            <div class="card bg-white text-dark shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    <h5 class="fw-bold text-center mb-4">Sign in to your Portal</h5>

                    <!-- Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${logoutMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${logoutMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email / Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="text" name="username" id="usernameInput" class="form-control" placeholder="user@getufit.lk" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" name="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                        </button>
                    </form>

                    <!-- Quick Demo Logins -->
                    <div class="mt-4 pt-4 border-top">
                        <small class="text-muted d-block text-center fw-semibold mb-2" style="font-size:0.72rem;">ONE-CLICK DEMO PERSONAS</small>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-sm btn-outline-dark text-start" onclick="fillDemo('admin@apexfit.com', 'password123')">
                                <span class="badge bg-danger me-1">Admin</span> admin@apexfit.com
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger text-start" onclick="fillDemo('elena.rostova@apexfit.com', 'password123')">
                                <span class="badge text-white me-1" style="background:#D4145A;">Trainer</span> elena.rostova@apexfit.com (Coach)
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary text-start" onclick="fillDemo('sophia.miller@example.com', 'password123')">
                                <span class="badge bg-dark me-1">Member</span> sophia.miller@example.com (Athlete)
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <a th:href="@{/}" class="text-decoration-none text-muted small">&larr; Return to Public Website</a>
                    </div>

                </div>
            </div>

            <p class="text-center text-muted small mt-4">
                &copy; Get U Fit Gym, Colombo &bull; 195 2/3, Galle - Colombo Rd
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function fillDemo(username, password) {
        document.getElementById('usernameInput').value = username;
        document.getElementById('passwordInput').value = password;
    }
</script>
</body>
</html>
