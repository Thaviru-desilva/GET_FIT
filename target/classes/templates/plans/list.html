<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head('Membership Plans')}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('plans')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold m-0">Membership Tiers &amp; Pricing</h3>
                    <p class="text-muted small m-0">Configure available subscription packages and durations</p>
                </div>
                <div>
                    <a th:href="@{/plans/new}" class="btn btn-primary d-flex align-items-center gap-1">
                        <i class="bi bi-plus-circle"></i> Create New Plan
                    </a>
                </div>
            </div>

            <!-- Pricing Tier Cards -->
            <div class="row g-4">
                <div class="col-12" th:if="${#lists.isEmpty(plans)}">
                    <div class="card p-5 text-center text-muted">
                        No membership plans created yet.
                    </div>
                </div>

                <div class="col-xl-3 col-md-6" th:each="p : ${plans}">
                    <div class="card shadow-sm h-100 border-top border-4" th:classappend="${p.active} ? 'border-primary' : 'border-secondary'">
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="fw-bold text-dark m-0" th:text="${p.name}">Plan Name</h5>
                                <span th:if="${p.active}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">Active</span>
                                <span th:if="${!p.active}" class="badge bg-secondary">Inactive</span>
                            </div>

                            <p class="text-muted small mb-3 flex-grow-1" th:text="${p.description}">Description</p>

                            <div class="my-3">
                                <span class="fs-1 fw-extrabold text-primary" th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}">$0.00</span>
                                <span class="text-muted small" th:text="' / ' + ${p.durationDays} + ' days'"> / 30 days</span>
                            </div>

                            <div class="bg-light p-2 rounded small text-muted mb-3">
                                <i class="bi bi-calendar3 me-1"></i> Validity: <strong class="text-dark" th:text="${p.durationDays} + ' Days'"></strong>
                            </div>

                            <div class="d-flex gap-2 pt-2 border-top mt-auto">
                                <a th:href="@{'/plans/edit/' + ${p.id}}" class="btn btn-sm btn-outline-primary w-50">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <a th:href="@{'/plans/delete/' + ${p.id}}" class="btn btn-sm btn-outline-danger w-50" onclick="return confirm('Delete this membership plan?');">
                                    <i class="bi bi-trash"></i> Delete
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

</body>
</html>
