<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head(${member.id != null ? 'Edit Member' : 'New Member'})}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('members')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <div class="mb-4">
                <a th:href="@{/members}" class="text-decoration-none text-muted small">&larr; Back to Member List</a>
                <h3 class="fw-bold mt-1" th:text="${member.id != null ? 'Edit Member Profile' : 'Register New Member'}">Member</h3>
            </div>

            <div class="card shadow-sm col-lg-9 mx-auto">
                <div class="card-header bg-white py-3">
                    <span class="fw-semibold text-primary"><i class="bi bi-person-lines-fill me-1"></i> Member Information</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/members/save}" th:object="${member}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{joinDate}">

                        <!-- Personal Details -->
                        <h6 class="text-muted fw-bold text-uppercase mb-3" style="font-size: 0.75rem;">Personal Details</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">First Name *</label>
                                <input type="text" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" placeholder="e.g. John" required>
                                <div class="invalid-feedback" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Last Name *</label>
                                <input type="text" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" placeholder="e.g. Doe" required>
                                <div class="invalid-feedback" th:errors="*{lastName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email Address *</label>
                                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="john.doe@example.com" required>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Phone Number</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="+1-555-0199">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Gender</label>
                                <select th:field="*{gender}" class="form-select">
                                    <option value="">-- Select Gender --</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Date of Birth</label>
                                <input type="date" th:field="*{dateOfBirth}" class="form-control">
                            </div>
                        </div>

                        <!-- Emergency Contact -->
                        <h6 class="text-muted fw-bold text-uppercase mb-3" style="font-size: 0.75rem;">Emergency Contact</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Contact Person Name</label>
                                <input type="text" th:field="*{emergencyContactName}" class="form-control" placeholder="e.g. Sarah Doe">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Contact Phone Number</label>
                                <input type="text" th:field="*{emergencyContactPhone}" class="form-control" placeholder="+1-555-0999">
                            </div>
                        </div>

                        <!-- Gym Assignment & Status -->
                        <h6 class="text-muted fw-bold text-uppercase mb-3" style="font-size: 0.75rem;">Gym &amp; Trainer Assignment</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Assign Personal Trainer</label>
                                <select th:field="*{assignedTrainer}" class="form-select">
                                    <option value="">-- No Trainer Assigned --</option>
                                    <option th:each="t : ${trainers}"
                                            th:value="${t.id}"
                                            th:text="${t.fullName} + ' (' + ${t.specialization} + ')'"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Membership Status</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>
                                    <option value="EXPIRED">EXPIRED</option>
                                    <option value="PENDING">PENDING</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/members}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Save Member
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

</body>
</html>
