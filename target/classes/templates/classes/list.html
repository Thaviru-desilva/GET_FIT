<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/components :: head('Class Schedule')}"></head>
<body>

<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/components :: sidebar('classes')}"></div>

    <div class="main-content flex-grow-1 bg-light min-vh-100 d-flex flex-column">
        <nav th:replace="~{fragments/components :: navbar}"></nav>

        <div class="p-4 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold m-0">Fitness Class Timetable</h3>
                    <p class="text-muted small m-0">Group fitness training sessions, functional workouts &amp; yoga schedule</p>
                </div>
                <div sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_TRAINER')">
                    <a th:href="@{/classes/new}" class="btn btn-primary d-flex align-items-center gap-1">
                        <i class="bi bi-calendar-plus-fill"></i> Schedule New Class
                    </a>
                </div>
            </div>

            <!-- Flash alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Classes Grid -->
            <div class="row g-4">
                <div class="col-12" th:if="${#lists.isEmpty(classes)}">
                    <div class="card p-5 text-center text-muted">
                        <i class="bi bi-calendar-x fs-1 mb-2"></i>
                        No fitness classes scheduled yet.
                    </div>
                </div>

                <div class="col-xl-4 col-md-6" th:each="c : ${classes}">
                    <div class="card shadow-sm h-100 border-top border-4 border-primary">
                        <div class="card-body p-4 d-flex flex-column">

                            <!-- Header -->
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="fw-bold text-dark m-0" th:text="${c.name}">Class Name</h5>
                                <span class="badge bg-light text-dark border">
                                    <i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="${c.room}">Room</span>
                                </span>
                            </div>

                            <p class="text-muted small mb-3 flex-grow-1" th:text="${c.description}">Description</p>

                            <!-- Trainer details -->
                            <div class="d-flex align-items-center gap-2 p-2 bg-light rounded mb-3">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                                    <i class="bi bi-person-badge"></i>
                                </div>
                                <div>
                                    <small class="text-muted d-block" style="font-size: 0.7rem;">COACH / INSTRUCTOR</small>
                                    <span class="fw-semibold small" th:text="${c.trainer.fullName}">Coach Name</span>
                                    <span class="text-muted small" th:text="'(' + ${c.trainer.specialization} + ')'"></span>
                                </div>
                            </div>

                            <!-- Schedule Timing -->
                            <div class="mb-3 small">
                                <div class="text-muted mb-1">
                                    <i class="bi bi-calendar-week text-primary me-1"></i>
                                    <strong class="text-dark" th:text="${c.dayOfWeek}">Days</strong>
                                </div>
                                <div class="text-muted">
                                    <i class="bi bi-clock text-primary me-1"></i>
                                    <span th:text="${c.startTime} + ' - ' + ${c.endTime}">07:00 - 08:00</span>
                                </div>
                            </div>

                            <!-- Spots capacity indicator -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between small mb-1">
                                    <span class="text-muted">Occupancy:</span>
                                    <span class="fw-semibold">
                                        <span th:text="${c.confirmedBookingsCount}">0</span>/<span th:text="${c.capacity}">15</span> spots
                                        (<span class="text-success" th:text="${c.availableSpots} + ' available'"></span>)
                                    </span>
                                </div>
                                <div class="progress" style="height: 6px;">
                                    <div class="progress-bar"
                                         role="progressbar"
                                         th:style="'width: ' + ${(c.confirmedBookingsCount * 100.0) / c.capacity} + '%'"
                                         th:classappend="${c.isFull()} ? 'bg-danger' : 'bg-primary'"></div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="pt-3 border-top mt-auto">
                                <!-- Member Booking Action -->
                                <div sec:authorize="hasAuthority('ROLE_MEMBER')">
                                    <div th:if="${bookedClassIds.contains(c.id)}" class="alert alert-success py-2 px-3 small text-center mb-0 d-flex align-items-center justify-content-center gap-1">
                                        <i class="bi bi-check-circle-fill"></i> You are enrolled in this class!
                                    </div>
                                    <div th:unless="${bookedClassIds.contains(c.id)}">
                                        <form th:if="${!c.isFull()}" th:action="@{'/classes/book/' + ${c.id}}" method="post">
                                            <button type="submit" class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                                <i class="bi bi-bookmark-plus-fill"></i> Book My Spot
                                            </button>
                                        </form>
                                        <button th:if="${c.isFull()}" class="btn btn-secondary w-100 py-2" disabled>
                                            <i class="bi bi-lock-fill"></i> Class Full
                                        </button>
                                    </div>
                                </div>

                                <!-- Admin & Trainer Action Controls -->
                                <div sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_TRAINER')" class="d-flex gap-2">
                                    <a th:href="@{'/classes/view/' + ${c.id}}" class="btn btn-sm btn-outline-info flex-grow-1">
                                        <i class="bi bi-people-fill"></i> Roster (<span th:text="${c.confirmedBookingsCount}"></span>)
                                    </a>
                                    <a th:href="@{'/classes/edit/' + ${c.id}}" class="btn btn-sm btn-outline-primary" title="Edit Schedule">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{'/classes/delete/' + ${c.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this scheduled class?');" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>

        <footer th:replace="~{fragments/components :: footer}"></footer>
    </div>
</div>

</body>
</html>
